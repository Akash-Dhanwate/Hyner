name: hyner
description: Hyner — a secure, modular business workspace for Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/google-g.png
    - assets/branding/hyner-mark.svg
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
